name: Construire le comparateur

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.py'
      - 'tools/**'
      - 'docs/logo_*.png'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

# Plusieurs envois rapprochés : seule la construction la plus récente compte, les précédentes sont annulées.
concurrency:
  group: construire-comparateur
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Construire les pages
        run: python3 build.py

      - name: Placer la page a la racine
        run: cp dist/index.html index.html

      # Images des sélections sans tarif pour le CRM (docs/tg/) : refaites seulement quand
      # ce qu'elles montrent a changé — la vérification se passe de navigateur.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Images des selections sans tarif
        run: |
          if node tools/images_tg.js --verifier; then exit 0; fi
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node tools/images_tg.js

      - name: Publier
        run: |
          git config user.name "Fabrice Cohen"
          git config user.email "fcohen@santeo.net"
          # garanties.json est regenere par build.py : il suit la page, jamais l'inverse.
          if git diff --quiet -- index.html src/garanties.json && [ -z "$(git status --porcelain -- docs/tg)" ]; then
            echo "Aucun changement a publier."
            exit 0
          fi
          git add index.html src/garanties.json src/tableau.css docs/tg
          git commit -m "Comparateur : construction automatique"
          # La branche a pu avancer pendant la construction (envoi suivant) : on se replace dessus avant de pousser.
          # En cas de conflit, la construction déclenchée par cet envoi plus récent publiera à notre place.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || { git rebase --abort; echo "Construction plus récente en cours : elle publiera."; exit 0; }
          done
          exit 1
