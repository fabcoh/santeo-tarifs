<title>Comparateur Santéo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --ground:#F6F7F4; --panel:#FFFFFF; --ink:#1A2740; --muted:#5C6879; --line:#DDE1DA;
  --accent:#0E6E8C; --accent-ink:#FFFFFF; --soft:#EAF1EF;
  --best:#FBF3DC; --best-line:#D9C489;
  --ok:#1A7A5C; --ok-bg:#E4F1EB; --warn:#A9651B; --warn-bg:#F6EBDA;
  --mcci:#C33B54; --avenir:#2F6B3C;
  --respc:#157A46; --nrc:#8B2332;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141922; --panel:#1C2330; --ink:#E8EBF0; --muted:#9AA5B5; --line:#313A49;
    --accent:#4FB3D4; --accent-ink:#0E1620; --soft:#22303A;
    --best:#33301F; --best-line:#8A7A45;
    --ok:#5CC79C; --ok-bg:#1E332B; --warn:#E0A55E; --warn-bg:#39301F;
    --mcci:#E06A80; --avenir:#7BC488;
    --respc:#5CC79C; --nrc:#E08A96;
  }
}
:root[data-theme="dark"]{
  --ground:#141922; --panel:#1C2330; --ink:#E8EBF0; --muted:#9AA5B5; --line:#313A49;
  --accent:#4FB3D4; --accent-ink:#0E1620; --soft:#22303A;
  --best:#33301F; --best-line:#8A7A45;
  --ok:#5CC79C; --ok-bg:#1E332B; --warn:#E0A55E; --warn-bg:#39301F;
  --mcci:#E06A80; --avenir:#7BC488;
  --respc:#5CC79C; --nrc:#E08A96;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:14.5px/1.5 "IBM Plex Sans",system-ui,sans-serif;margin:0;padding:0 14px 48px}
.wrap{max-width:1720px;margin:0 auto}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:22px 2px 12px}
h1{font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-size:25px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px}
.topflex{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;margin-top:10px}
.topflex .bar{flex:1 1 560px;max-width:860px;min-width:320px}
.topflex .rightcol{flex:1 1 380px;display:flex;flex-direction:column;gap:10px}
.topflex .rightcol .gsel{margin-top:0;align-content:flex-start;flex:1}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.bar .row{display:grid;gap:12px}
.bar .row1{grid-template-columns:1fr 1fr}
.bar .row2{grid-template-columns:1.4fr 1fr .8fr}
@media (max-width:620px){
  body{padding:0 8px 40px}
  .bar{padding:10px;gap:8px}
  .bar .row{gap:8px}
  .f label{font-size:9.5px;font-weight:500;letter-spacing:.04em;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .f input,.f select{padding:7px 8px;font-size:15px}
  .ageout{font-size:10.5px;margin-top:2px}
  .gsel{padding:8px 10px;gap:6px 8px}
  .gsel label.g{font-size:11.5px;padding:2px 6px}
  h1{font-size:21px}
  .sub{font-size:11px}
  td{padding:6px 7px;font-size:12px}
  th{padding:6px 7px;font-size:9.5px}
  th.grp,th.big{font-size:10.5px}
  thead tr:first-child th{font-size:10.5px}
  thead tr:first-child th{height:26px}
  thead tr:nth-child(2) th{top:26px;height:18px}
  .gname{font-size:11px}
  .fname{font-size:12px}
  .chip{font-size:8.5px;padding:1px 5px}
  .total{font-size:13px}
  table{min-width:812px}
  .tblwrap{max-height:76vh}
}
.f label{display:block;font-family:"Archivo",sans-serif;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.f input,.f select{font-weight:700;font-size:16px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--ground);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.f input:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.ageout{font-size:11.5px;color:var(--muted);margin-top:4px}
.gsel{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.gsel .lbl{font-family:"Archivo",sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gsel label.g{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:7px;border:1px solid var(--line);background:var(--ground)}
.gsel label.g input{accent-color:var(--accent)}
.results{margin-top:16px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.meta .pill{font-family:"Archivo",sans-serif;font-weight:600;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.tblwrap{overflow:auto;max-height:80vh;background:var(--panel);border:1px solid var(--line);border-radius:10px}
thead{background:var(--panel)}
thead th{position:sticky;background:var(--panel);z-index:3;box-shadow:0 1px 0 var(--line)}
thead tr:first-child th{top:0;height:32px}
thead tr:nth-child(2) th{top:32px;height:22px}
th:first-child,td:first-child{position:sticky;left:0;background:var(--panel);z-index:2;width:24px;min-width:24px}
th:nth-child(2),td:nth-child(2){position:sticky;left:24px;background:var(--panel);z-index:2}
thead th:first-child,thead th:nth-child(2){z-index:4}
th.big{font-size:12.5px;font-weight:800;color:var(--ink)}
thead tr:first-child th{vertical-align:top;padding-top:9px;color:var(--accent);font-weight:800;font-size:12px}
thead tr:first-child th.grp,thead tr:first-child th.big{font-size:12px}
thead tr:first-child th.grp,thead tr:first-child th.big{color:var(--accent)}
table{border-collapse:collapse;width:100%;min-width:846px;table-layout:fixed}
th{font-family:"Archivo",sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
th.c{text-align:center}
th.grp{text-align:center;border-bottom:none;padding-bottom:2px;font-size:12.5px;font-weight:800;color:var(--accent)}
th.sub{font-size:8.5px;font-weight:600;letter-spacing:.03em;padding-top:0;color:var(--muted);opacity:.85}
td.g{text-align:center;font-variant-numeric:tabular-nums}
th.num,td.num{text-align:right}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.offer{cursor:pointer}
tr.offer:hover td{background:var(--soft)}
.total{font-weight:700;font-size:15px}
.caret{display:inline-block;width:14px;color:var(--muted);transition:transform .15s;font-size:11px}
tr.open .caret{transform:rotate(90deg)}
.gamme{display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.dot.mcci{background:var(--mcci)} .dot.avenir{background:var(--avenir)} .dot.mverte{background:#3FA34D}
.gsel label.g{flex-direction:column;gap:1px;align-items:center}
.gsel label.g .comp{font-size:8.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.gsel label.g .top{display:inline-flex;align-items:center;gap:6px}
.gname{font-family:"Archivo",sans-serif;font-weight:700;font-size:12.5px}
.rp{color:var(--respc)} .nrp{color:var(--nrc)}
.gsel label.g.rp,.gsel label.g.nrp{font-weight:700}
.fname{font-weight:600}
.hosp{color:var(--muted);font-size:11.5px;margin-top:1px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:10px;font-weight:600;font-family:"Archivo",sans-serif;letter-spacing:.03em;padding:2px 7px;border-radius:99px;border:1px solid transparent}
.chip.resp{background:var(--ok-bg);color:var(--ok)}
.chip.nr{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--soft);color:var(--muted);border-color:var(--line)}
tr.best td{background:var(--best)}
tr.best td:first-child{box-shadow:inset 3px 0 0 var(--best-line)}
tr.best.offer:hover td{background:var(--best)}
.bestlbl{font-size:10px;font-weight:700;font-family:"Archivo",sans-serif;color:var(--warn);letter-spacing:.05em;text-transform:uppercase}
tr.detail td{background:var(--soft);padding:8px 10px 10px 34px;font-size:13px}
.bk{display:flex;gap:22px;flex-wrap:wrap}
.bk div b{font-variant-numeric:tabular-nums}
.bk .who{color:var(--muted);font-family:"Archivo",sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;display:block}
.warnbox{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:9px 13px;font-size:12.5px;color:var(--muted)}
.condbox{margin-top:12px;background:var(--soft);border:1px solid var(--accent);border-left:5px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:13.5px;line-height:1.55;color:var(--ink)}
.condbox b{color:var(--accent);font-family:"Archivo",sans-serif;font-weight:800;margin-right:4px}
.condbox div+div{margin-top:5px}
@media (max-width:620px){.condbox{font-size:12.5px;padding:8px 11px}}
.notes{margin-top:16px;font-size:11.5px;color:var(--muted);line-height:1.7}
.notes b{color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tgbtn{margin-left:auto;font:600 12px "Archivo",sans-serif;color:var(--accent);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;text-decoration:none;display:inline-block}
#tgov{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#tgbox{background:var(--panel);color:var(--ink);border-radius:12px;max-width:880px;width:100%;max-height:86vh;overflow:auto;padding:18px;border:1px solid var(--line)}
#tgbox h2{font-family:"Archivo",sans-serif;font-size:17px;margin:0 0 4px}
#tgbox .src{font-size:11px;color:var(--muted);margin-bottom:10px}
#tgbox table{width:100%;min-width:0;table-layout:auto;border-collapse:collapse}
#tgbox th,#tgbox td{padding:6px 8px;font-size:12.5px;border-bottom:1px solid var(--line);text-align:center}
#tgbox td:first-child,#tgbox th:first-child{text-align:left;font-weight:600;position:static;width:auto;min-width:0;background:transparent}
#tgbox thead th{position:static;height:auto;color:var(--accent);font-size:11.5px;background:transparent;box-shadow:none;vertical-align:bottom;padding-top:6px}
#tgbox .close{float:right;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:7px;padding:4px 10px;cursor:pointer;font-weight:700}
#tgbox .foot{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}
#tgbox.infobox{max-width:640px}
#tgbox .ipost{margin:12px 0 0}
#tgbox .ipost h3{font:800 12px 'Archivo',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:0 0 5px;border-bottom:1px solid var(--line);padding-bottom:3px}
#tgbox .irow{display:flex;gap:12px;align-items:baseline;padding:4px 0;border-bottom:1px dotted var(--line);font-size:13px}
#tgbox .irow span{flex:1}
#tgbox .irow b{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#tgbox .irow.iwarn{background:var(--warn-bg);border-radius:6px;padding:5px 8px;border-bottom:0;margin:2px 0}
#tgbox .irow.iwarn span::before{content:"⚠ ";color:var(--warn)}
#tgbox .irow.iwarn b{color:var(--warn)}
.ibtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--accent);background:var(--soft);color:var(--accent);border-radius:7px;padding:4px 10px 4px 7px;cursor:pointer;font:700 12px 'Archivo',sans-serif;line-height:1}
.ibtn svg{flex:none}
.ibtn:hover{background:var(--accent);color:var(--accent-ink)}
#tgbox th.pick{cursor:pointer}
#tgbox th.pick:hover{color:var(--accent)}
#tgbox td.reco,#tgbox th.reco{background:var(--best);border-left:2px solid var(--warn);border-right:2px solid var(--warn)}
#tgbox thead th.reco{border-top:2px solid var(--warn)}
#tgbox tbody tr:last-child td.reco{border-bottom:2px solid var(--warn)}
#tgbox .recolbl{display:block;font:800 10.5px 'Archivo',sans-serif;letter-spacing:.03em;color:var(--warn);margin-bottom:2px;text-transform:none}
#tgbox .rectip{font-size:11px;color:var(--muted);margin:-4px 0 8px}
#tgbox .star{display:block;font-size:16px;line-height:1;color:var(--muted);opacity:.55;margin-bottom:2px}
#tgbox th.pick:hover .star{opacity:1;color:var(--warn)}
#tgbox.capwide .recolbl{font-size:13px}
#tgbox.capwide{max-width:none;max-height:none;height:auto;overflow:visible;flex:0 0 auto;align-self:flex-start}
#tgbox.capwide table{width:max-content}
#tgbox.capwide th,#tgbox.capwide td{white-space:nowrap;font-size:15.5px;padding:9px 13px}
#tgbox.capwide thead th{font-size:14.5px}
#tgbox.capwide h2{font-size:21px}
#tgbox.capwide .src{font-size:13px}
#tgbox.capwide .foot{font-size:13px;line-height:1.55}
.f input,.f select{font-weight:800 !important;color:var(--ink)}
#reload{position:fixed;top:10px;right:10px;z-index:50;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--accent);font-size:19px;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}
#reload:active{transform:rotate(180deg)}
#reload{touch-action:manipulation;-webkit-user-select:none;user-select:none}
#aipanel[hidden]{display:none}#aipanel:not([hidden]){display:flex}
.sendchk{display:block;width:18px;height:18px;margin:5px auto 0;accent-color:var(--accent)}
.rowstar{border:0;background:transparent;cursor:pointer;font-size:15px;line-height:1;padding:0 0 0 6px;color:var(--muted);vertical-align:-1px}
.rowstar:hover{color:var(--warn)}
.rowstar.on{color:var(--warn)}
tr.offer.reco td{background:var(--best)}
tr.offer.reco td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tr.offer.reco:hover td{background:var(--best)}
.chip.reco{background:var(--best);color:var(--warn);border-color:var(--warn)}
.volet{width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink);font:800 14px 'Archivo',sans-serif;cursor:pointer;margin-bottom:6px}
.volet .vsum{font:600 12px 'IBM Plex Sans',sans-serif;color:var(--muted)}
.volet .chev{margin-left:auto;transition:transform .15s;color:var(--muted)}
.volet.open .chev{transform:rotate(180deg)}
#gsel[hidden],#expanel[hidden]{display:none}
</style>
<button id="aibtn" title="Assistant IA" style="position:fixed;bottom:16px;right:16px;z-index:60;display:none;padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--accent);color:var(--accent-ink);font:700 14px 'Archivo',sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)">🤖 Assistant</button>
<div id="aipanel" hidden style="position:fixed;bottom:66px;right:16px;z-index:60;width:min(440px,92vw);max-height:70vh;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)">
  <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)">
    <b style="font-family:'Archivo',sans-serif">Assistant garanties</b>
    <span style="font-size:10.5px;color:var(--muted)">documents contractuels seuls font foi</span>
    <button id="aiclose" style="margin-left:auto;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer">✕</button>
  </div>
  <div id="ailog" style="flex:1;overflow:auto;padding:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap"></div>
  <div style="display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)">
    <input id="aiq" placeholder="Ta question sur les garanties…" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--ground);color:var(--ink);font:inherit">
    <button id="aisend" style="border:none;background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:8px 14px;font-weight:700;cursor:pointer">Envoyer</button>

</div>
<button id="reload" title="Recharger la dernière version" aria-label="Recharger">↻</button>
<div class="wrap">
<div class="topflex">

    <div class="f"><label for="naiss">Assuré — année / âge</label>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const D = __DATA__;
const BULLETIN_B64="__BULLETIN__";
const YEAR = new Date().getFullYear();
const CUSE=async n=>{try{return (typeof claude!=="undefined"&&claude&&claude.use)?await claude.use(n):null}catch(e){return null}};
// HOSTED = page hébergée hors claude.ai (GitHub Pages / CRM) : aucune contrainte de plateforme
const HOSTED=__HOSTED__;
// Accès au bulletin d'adhésion sur le site hébergé : code d'accès (empreinte SHA-256), mémorisé sur l'appareil
const ADHGATE="__GATE__";
async function sha256(s){const b=new TextEncoder().encode(s);const h=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function adhUnlocked(){if(!ADHGATE)return true;try{return localStorage.getItem("santeo_adh")===ADHGATE;}catch(e){return false;}}
function adhLogout(){try{localStorage.removeItem("santeo_adh");}catch(e){}updateAdhBadge();}
function updateAdhBadge(){
  let b=document.getElementById("adhbadge");
  if(!ADHGATE)return;
  if(!adhUnlocked()){if(b)b.remove();return;}
  if(b)return;
  b=document.createElement("button");b.id="adhbadge";b.textContent="🔓 Adhésion";b.title="Bulletin d'adhésion débloqué sur cet appareil — cliquer pour verrouiller";

function withAdhGate(cb){
  if(adhUnlocked()){cb();return;}
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:1002;display:flex;align-items:flex-start;justify-content:center;padding:80px 16px 16px";
  ov.innerHTML='<div style="background:var(--panel,#fff);color:var(--ink,#12233d);border-radius:14px;max-width:360px;width:100%;padding:16px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35);font-family:\'Archivo\',sans-serif">'
    +'<div style="font:800 15px \'Archivo\',sans-serif;margin-bottom:6px">🔒 Bulletin d\'adhésion — accès réservé</div>'
    +'<div style="font-size:13px;color:var(--muted,#667);margin-bottom:10px">Entrez le code d\'accès Santéo. Il est mémorisé sur cet appareil.</div>'
    +'<input id="gpwd" type="password" autocomplete="current-password" placeholder="Code d\'accès" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line,#ccc);border-radius:9px;background:var(--ground,#f6f7f4);color:var(--ink,#12233d);font:15px \'IBM Plex Sans\',sans-serif">'
    +'<div id="gerr" style="color:#c62828;font-size:13px;margin-top:6px;min-height:16px"></div>'
    +'<div style="display:flex;gap:8px;margin-top:8px"><button id="gok" style="flex:1;padding:11px;border:0;border-radius:9px;background:var(--accent,#1b4f8a);color:#fff;font:700 14px \'Archivo\',sans-serif;cursor:pointer">Se connecter</button>'
    +'<button id="gno" style="padding:11px 14px;border:1px solid var(--line,#ccc);border-radius:9px;background:var(--soft,#eee);color:var(--ink,#12233d);font:700 14px \'Archivo\',sans-serif;cursor:pointer">Annuler</button></div></div>';
  document.body.appendChild(ov);
  const inp=ov.querySelector("#gpwd");inp.focus();
  const go=async()=>{
    const h=await sha256(inp.value.trim());
    if(h===ADHGATE){try{localStorage.setItem("santeo_adh",h);}catch(e){}ov.remove();updateAdhBadge();cb();}
    else{ov.querySelector("#gerr").textContent="Code incorrect.";inp.select();}
  };
  ov.querySelector("#gok").addEventListener("click",go);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  ov.querySelector("#gno").addEventListener("click",()=>ov.remove());
  ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});
}

function ibanOK(v){
  v=v.replace(/\s+/g,"").toUpperCase();
  if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(v))return false;
  const r=(v.slice(4)+v.slice(0,4)).replace(/[A-Z]/g,c=>c.charCodeAt(0)-55);
  let m=0; for(const d of r) m=(m*10+ +d)%97;
  return m===1;
}
function secuOK(v){
  v=v.replace(/\s+/g,"").toUpperCase().replace(/^(\d{5})2A/,"$119").replace(/^(\d{5})2B/,"$118");
  if(!/^\d{15}$/.test(v))return false;
  let m=0; for(const d of v.slice(0,13)) m=(m*10+ +d)%97;   // clé = 97 − (13 premiers chiffres modulo 97)

}

  }
  if(!out.nom){const n=TC.match(/\bnom\s*(?:de naissance)?\s*:?\s*([A-ZÀ-Ý][A-ZÀ-Ý'\- ]{1,40})/);if(n)out.nom=n[1].trim();}
  if(!out.prenom){const n=TC.match(/\bpr[ée]nom[s]?\s*:?\s*([A-ZÀ-Ýa-zà-ÿ][\wÀ-ÿ'\-]{1,25})/i);if(n)out.prenom=n[1].trim();}
  // Adresse : ligne « Adresse » puis code postal + ville
  const ad=TC.match(/adresse\s*:?\s*([^\n]{5,70}?)\s*(\d{5})\s+([A-ZÀ-Ýa-zà-ÿ'\- ]{2,40})/i);
  const cleanCity=v=>v.trim().split(/\s+/).filter(w=>!/\d/.test(w)&&w.length<=18).slice(0,4).join(" ").trim();
  if(ad){out.adresse=ad[1].trim().replace(/[,;]$/,"");out.cp=ad[2];out.ville=cleanCity(ad[3]);}
  else{const cpv=TC.match(/\b(\d{5})\s+([A-ZÀ-Ý][A-ZÀ-Ý'\- ]{2,30})\b/);if(cpv){out.cp=cpv[1];out.ville=cleanCity(cpv[2]);}}
  // Organisme d'affiliation (9 chiffres, souvent annoncé par « organisme » ou « caisse »)
  const org=T.match(/organisme[^0-9]{0,40}(\d[\d\s]{7,14}\d)/i)||T.match(/caisse[^0-9]{0,40}(\d[\d\s]{7,14}\d)/i)||T.match(/\b(\d{9})\b(?=[^\d]{0,30}(?:CPAM|caisse|organisme))/i);
  if(org)out.org=org[1].replace(/\s+/g,"");
  return out;
}
async function readPdfText(file){
  if(typeof pdfjsLib==="undefined"){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let t="";
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+=" "+c.items.map(x=>x.str).join(" ");}
  return t;
}
async function readImageText(file,onProgress){
  if(typeof Tesseract==="undefined")await loadScript("https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js");
  const url=URL.createObjectURL(file);
  try{
    const {data}=await Tesseract.recognize(url,"fra",{logger:m=>{if(m.status==="recognizing text"&&onProgress)onProgress(Math.round(m.progress*100));}});
    return data.text;
  } finally { URL.revokeObjectURL(url); }
}
const ZONES={rib:["iban","bic"],secu:["secu","org"],id:["nom","prenom","ddn","adresse","cp","ville"],
  autre:["iban","bic","secu","org","nom","prenom","ddn","adresse","cp","ville"]};
const KINDLBL={rib:"RIB",secu:"Attestation de droits",id:"Pièce d'identité",autre:"Document"};
async function scanDocs(files,st){
  const found=[];
  for(const f of files){
    st.textContent="Lecture de "+f.name+"…";
    let txt="";
    try{
      if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)) txt=await readPdfText(f);
      else txt=await readImageText(f,p=>{st.textContent="Lecture de "+f.name+" — "+p+" %";});
    }catch(e){ st.textContent="Impossible de lire "+f.name+" ("+(e&&e.message||e)+")"; continue; }
    const all=extractDocFields(txt);
    const kind=docKind(txt);
    const got={};
    ZONES[kind].forEach(k=>{if(all[k])got[k]=all[k];});
    // Un PDF sans texte (scan) : on repasse en reconnaissance d'image
    if(!Object.keys(got).length&&/pdf$/i.test(f.type)&&(txt||"").replace(/\s/g,"").length<40){
      st.textContent=f.name+" : PDF sans texte — utilisez une photo du document.";
    }
    const holder=docHolder(txt,kind,all);
    // Pièce d'identité sans mention « Nom » lisible : on reprend le titulaire détecté
    if(kind==="id"&&!got.nom){const s=splitHolder(holder);if(s){got.nom=s.nom;got.prenom=got.prenom||s.prenom;}}
    found.push({file:f.name,kind:kind,fields:got,holder:holder});
  }
  return found;
}
// Comparaison souple des noms (accents, casse, ordre)
function sameName(a,b){
  const norm=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z ]/g," ").split(/\s+/).filter(w=>w.length>2);
  const A=norm(a),B=norm(b);
  if(!A.length||!B.length)return null;         // impossible de conclure
  return A.some(w=>B.includes(w));
}

// Confirmation avant de recopier : un bloc par document, alerte si le nom ne correspond pas
function confirmDoc(docs,onDone){
  const esc=v=>String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
  const fiche=((document.getElementById("anom")||{}).value||"")+" "+((document.getElementById("apre")||{}).value||"");
  const LAB={secu:["ass","N° de Sécurité sociale",0],org:["aorg","N° organisme d'affiliation",0],
    iban:["aiban","IBAN",0],bic:["abic","BIC",0],nom:["anom","Nom",0],prenom:["apre","Prénom",0],
    ddn:["addn","Date de naissance",0],adresse:["aadr","Adresse",1],cp:["acp","Code postal",1],ville:["avil","Ville",1]};
  const rows=[]; let html="";
  docs.forEach(d=>{
    const keys=Object.keys(d.fields); if(!keys.length)return;
    const ok=sameName(fiche,d.holder);
    html+='<div class="ipost"><h3>'+esc(KINDLBL[d.kind]||"Document")+' <span style="font-weight:500;text-transform:none;color:var(--muted)">'+esc(d.file)+'</span></h3>';
    if(ok===false)html+='<div class="irow iwarn"><span>Nom du document : '+esc(d.holder)+'</span><b>ne correspond pas à la fiche ('+esc(fiche.trim()||"—")+')</b></div>';
    if(d.kind==="id")html+='<div class="irow iwarn"><span>Adresse issue d\'une pièce d\'identité</span><b>à confirmer (déménagement)</b></div>';
    keys.forEach(k=>{
      const L=LAB[k]; if(!L)return;
      let v=d.fields[k]; if(k==="iban")v=v.replace(/(.{4})/g,"$1 ").trim();
      const cur=((document.getElementById(L[0])||{}).value||"");
      const i=rows.length; rows.push({id:L[0],val:v});
      html+='<label class="irow" style="cursor:pointer"><span><input type="checkbox" data-i="'+i+'" '+(L[2]?'':'checked')+' style="margin-right:7px;accent-color:var(--accent)">'+L[1]
        +(cur?'<span style="display:block;font-size:11px;color:var(--muted);margin-left:23px">actuel : '+esc(cur)+'</span>':'')+'</span><b>'+esc(v)+'</b></label>';
    });
    html+='</div>';
  });
  if(!rows.length){onDone(0);return;}
  const ov=document.createElement("div");ov.id="tgov";ov.style.zIndex=1006;
  ov.innerHTML='<div id="tgbox" style="max-width:580px"><button class="close">Fermer ✕</button>'
    +'<h2>Informations trouvées</h2>'
    +'<div class="src">Chaque document ne renseigne que sa zone. Décochez ce que vous ne voulez pas reprendre, puis validez. Les alertes n\'empêchent pas la reprise.</div>'
    +html
    +'<div style="margin-top:12px;display:flex;gap:8px"><button id="cdok" class="tgbtn" style="background:var(--accent);color:var(--accent-ink);border:none">Reprendre la sélection</button>'
    +'<button id="cdno" class="tgbtn">Ne rien reprendre</button></div></div>';
  const close=n=>{ov.remove();onDone(n);};
  ov.addEventListener("click",e=>{if(e.target===ov||e.target.classList.contains("close"))close(0);});
  document.body.appendChild(ov);
  ov.querySelector("#cdno").addEventListener("click",()=>close(0));
  ov.querySelector("#cdok").addEventListener("click",()=>{
    let n=0;
    ov.querySelectorAll('input[type=checkbox]').forEach(c=>{
      if(!c.checked)return;
      const r=rows[+c.dataset.i], e=document.getElementById(r.id);
      if(!e)return;
      e.value=r.val; e.dispatchEvent(new Event("input",{bubbles:true}));
      e.style.transition="background .4s";const b=e.style.background;e.style.background="#DCF3E6";
      setTimeout(()=>{e.style.background=b;},1600); n++;
    });
    close(n);
  });
}
function wireDocDrop(){
  const box=document.getElementById("adocs"); if(!box)return;
  const inp=document.getElementById("adocf"), st=document.getElementById("adocst");
  const setv=(id,v)=>{const e=document.getElementById(id);if(!e||!v)return false;e.value=v;e.dispatchEvent(new Event("input",{bubbles:true}));
    e.style.transition="background .4s";const b=e.style.background;e.style.background="#DCF3E6";setTimeout(()=>{e.style.background=b;},1600);return true;};
  const apply=async files=>{
    if(!files||!files.length)return;
    st.textContent="Lecture…";
    const docs=await scanDocs([...files],st);
    if(!docs.some(d=>Object.keys(d.fields).length)){st.textContent="Aucune information reconnue dans ce document.";return;}
    st.textContent="";
    confirmDoc(docs,n=>{st.textContent=n?("✅ "+n+" champ"+(n>1?"s":"")+" recopié"+(n>1?"s":"")+" — vérifiez avant de générer."):"Aucun champ repris.";});
  };
  inp.addEventListener("change",()=>apply(inp.files));
  ["dragenter","dragover"].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();box.style.borderColor="var(--accent)";}));
  ["dragleave","drop"].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();box.style.borderColor="var(--line)";}));
  box.addEventListener("drop",e=>apply(e.dataTransfer.files));
}

const REQFIELDS=[["anom","Nom"],["apre","Prénom"],["addn","Date de naissance"],["aadr","Adresse"],
  ["acp","Code postal"],["avil","Ville"],["ass","N° de Sécurité sociale"],["atel","Téléphone"],["amail","E-mail"]];
const COUPONFIELDS=["brmb","bnd","bno","bnh","bnhon","bcss","baide","bpol","bbes","aanc","amot"];
var COUPONINIT=null;
function snapshotCoupon(){COUPONINIT={};COUPONFIELDS.forEach(id=>{const e=document.getElementById(id);if(e)COUPONINIT[id]=e.value;});}
function couponChanged(){
  if(!COUPONINIT)return 0;
  return COUPONFIELDS.filter(id=>{const e=document.getElementById(id);return e&&e.value!==COUPONINIT[id];}).length;
}
function missingFields(){
  const miss=[];
  for(const [id,lab] of REQFIELDS){
    const e=document.getElementById(id); if(!e)continue;
    const v=(e.value||"").trim();
    if(!v){miss.push([id,lab,"à renseigner"]);continue;}
    if(id==="amail"&&!/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(v))miss.push([id,lab,"adresse e-mail invalide"]);
    if(id==="addn"&&!/^\d{2}\/\d{2}\/(19|20)\d\d$/.test(v))miss.push([id,lab,"format attendu jj/mm/aaaa"]);
    if(id==="acp"&&!/^\d{5}$/.test(v))miss.push([id,lab,"5 chiffres attendus"]);
    if(id==="ass"&&!secuOK(v))miss.push([id,lab,"numéro incomplet ou clé incorrecte"]);
    if(id==="atel"&&(v.replace(/\D/g,"").length<10))miss.push([id,lab,"numéro incomplet"]);
  }
  return miss;
}

function showCoupon(onDone){
  const rows=[["brmb","Remboursements souhaités"],["bnd","Niveau Dentaire"],["bno","Niveau Optique"],
    ["bnh","Niveau Hospitalisation"],["bnhon","Niveau Honoraires"],["aanc","Ancienne mutuelle (niveau)"],

  const html='<button class="close">Fermer ✕</button><h2>Coupon des besoins</h2>'
    +'<div class="src">Devoir de conseil : ajustez les niveaux avec le prospect avant d\'établir le bulletin. Au moins un élément doit être adapté à sa situation.</div>'
    +'<div id="cpwrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 12px"></div>'

const sel={MCCINOVA:false,FLEXIA:false,SOLENCIA:false,CAPEVO:false,CAPNR:false,LPSH:false,REV:false,RF50:false,RF100:false,MV:false,TALIS:false};

function parseAge(s){
  s=(s||"").trim(); if(!/^\d{1,4}$/.test(s)) return null;
  const n=+s;
  if(n>=1900&&n<=YEAR) return YEAR-n;
  if(n>=0&&n<=110) return n;
  return null;
}
function deptOf(s){
  s=(s||"").trim().toUpperCase();
  if(s==="2A"||s==="2B") return s;
  if(/^\d{4,5}$/.test(s)){ // tolère un code postal complet
    if(s.length===4) s="0"+s;
    if(s.startsWith("97")) return s.slice(0,3);
    if(s.startsWith("20")) return (+s<=20190?"2A":"2B");
    return s.slice(0,2);
  }
  if(/^97\d$/.test(s)) return s;
  if(/^\d{1,2}$/.test(s)){ s=s.padStart(2,"0"); return s==="20"?"2A":s; }
  return null;
}

function calc(){
  const age=parseAge(document.getElementById("naiss").value);
  const cnjAge=parseAge(document.getElementById("cnj").value);
  const hasCnj=document.getElementById("cnj").value.trim()!=="";
  const kids=+document.getElementById("kids").value;
  const reg=document.getElementById("regime").value;
  const dept=deptOf(document.getElementById("cp").value);
  const zone=dept?ZMAP[dept]:null;
  document.getElementById("ageinfo").textContent=age==null?"":"Âge retenu : "+age+" ans";
  document.getElementById("cnjinfo").textContent=(hasCnj&&cnjAge!=null)?"Âge retenu : "+cnjAge+" ans":"";
  const rows=[],warns=[];
  if(age==null){render(rows,warns);return}
  const isRL=(reg==="RL"||reg==="TNSRL"), isTNS=(reg==="TNS"||reg==="TNSRL");
  const chMadelin=isTNS?[["info","Madelin à confirmer"]]:[];

  function push(key,fi,suffix,chips,pA,pC,pK,kidNote,incomplete){
    const total=Math.round((pA+(pC||0)+(pK||0))*100)/100,f=F[key];
    rows.push({key,fi,ins:f.ins,resp:f.resp,gamme:f.label+(suffix||""),formule:f.names[fi],
      hospO:f.hospO[fi],hospN:f.hospN[fi],honoO:f.honoO[fi],honoN:f.honoN[fi],
      dent:f.dent[fi],opt:f.opt[fi],aud:f.aud[fi],ch:f.ch[fi],md:f.md[fi],
      chips,pA,pC,pK,kidNote,total,incomplete:!!incomplete});
  }
  function mcci(key,suffix,grid,chips,minA,maxA,childPrice,childLabel){
    if(isRL||!on(key))return;
    if(age<minA||age>maxA){warns.push(F[key].label+" : non éligible à "+age+" ans (grille "+minA+"–"+maxA+" ans).");return}
    for(let i=0;i<F[key].names.length;i++){
      const pA=grid[age][i];
      let pC=null,cW=false;
      if(hasCnj&&cnjAge!=null){ if(cnjAge>=minA&&cnjAge<=maxA)pC=grid[cnjAge][i]; else cW=true; }
      let pK=null,kidNote="";
      if(kids>0){ if(childPrice){pK=Math.round(childPrice[i]*kids*100)/100;kidNote=kids+" × "+eur(childPrice[i])+(childLabel?" — "+childLabel:"");} else kidNote="pas de tarif enfant publié"; }
      push(key,i,suffix,chips.slice(),pA,hasCnj?(cW?undefined:pC):null,pK,kidNote,(hasCnj&&cW)||(kids>0&&pK==null));
    }
  }
  mcci("MCCINOVA","",D.MCCINOVA,[["nr","Non responsable"]].concat(chMadelin),18,90,D.MCCINOVA["18"],"tarif 18 ans");
  if(zone){
    mcci("FLEXIA","",D.FLEXIA[zone],[["resp","Responsable"]].concat(chMadelin),18,84,D.FLEXIA[zone]["E"]);
    mcci("SOLENCIA","",D.SOLENCIA[zone],[["resp","Responsable"]],62,99,D.SOLENCIA[zone]["E"]);
  } else if(!isRL) warns.push("Code postal manquant ou hors zonage : FLEXIA et SOLENCIA non calculées.");
  // CAP EVOLUTION — bloc par régime
  if(on("CAPEVO")&&age>=16){
    const g=D.CAPEVO[reg];
    const a=String(Math.min(Math.max(age,16),100));
    for(let i=0;i<4;i++){
      const pA=g[a][i*2];
      let pC=null;
      if(hasCnj&&cnjAge!=null&&cnjAge>=16)pC=g[String(Math.min(Math.max(cnjAge,16),100))][i*2+1];
      const kp=g["15"][i*2],kn=Math.min(kids,2);
      const pK=kids>0?kp*kn:null;
      push("CAPEVO",i,isTNS?" TNS":(isRL?" RL":""),[["resp","Responsable"]],pA,hasCnj?pC:null,pK,
        kids>0?(kn+" × "+eur(kp)+(kids>2?" (3ᵉ+ gratuit)":"")):"",false);
    }
  }
  // CAP NR — tarif unique salarié/TNS, colonne RL sinon zone AVENIR
  if(on("CAPNR")){
    const g=D.CAPNR;
    const c=isRL?0:(dept&&D.AVZ[dept]?D.AVZ[dept]:null);
    if(c===null){ if(!isRL) warns.push("CAP NR : code postal requis pour le zonage AVENIR."); }
    else if(age>=16&&age<=100){
      const a=String(age);
      for(let f=0;f<7;f++){
        const pA=g[a][f*8+c*2];
        let pC=null;
        if(hasCnj&&cnjAge!=null&&cnjAge>=16)pC=g[String(Math.min(Math.max(cnjAge,16),100))][f*8+c*2+1];
        const kp=g["15"][f*8+c*2],kn=Math.min(kids,2);
        const pK=kids>0?kp*kn:null;
        push("CAPNR",f,"",[["nr","Non responsable"]].concat(isTNS?[["info","Tarif unique sal./TNS"]]:[]),
          pA,hasCnj?pC:null,pK,kids>0?(kn+" × "+eur(kp)+(kids>2?" (3ᵉ+ gratuit)":"")):"",false);
      }
    }
  }
  // REVOLUO — base salarié × zone × régime (Alsace ×0,65 sans zone), mineurs payants max 2 (ligne 19 ans)
  if(on("REV")||on("RF50")||on("RF100")){
    const RZC={1:1,2:0.95,3:0.90,4:0.85,5:0.80};
    const rz=dept?D.RVZ[dept]:null;
    const isDom=dept&&dept.length===3;
    const nAd=1+((hasCnj&&cnjAge!=null)?1:0), nPers=nAd+kids;
    const fam=(nAd===2||nPers>=3)?0.90:(nAd===1&&kids===1)?0.95:1;
    const r2=v=>Math.round(v*100)/100;
    const coef=isRL?0.65:(rz?RZC[rz]*(isTNS?0.90:1):null);
    if(isDom) warns.push("REVOLUO : pas de souscription DOM-TOM.");
    else if(coef===null) warns.push("REVOLUO : département requis pour le zonage.");
    else if(age<19||age>80) warns.push("REVOLUO : non éligible à "+age+" ans (grille 19–80 ans).");
    else for(const key of ["REV","RF50","RF100"]){
      if(!on(key)) continue;
      const g=D.RVL[key], row=g[String(age)];
      for(let f=0;f<F[key].names.length;f++){
        const bA=row&&row[f]; if(!bA) continue;
        const pA=r2(bA*coef);
        let pC=null;
        if(hasCnj&&cnjAge!=null){
          const rw=(cnjAge>=19&&cnjAge<=80)?g[String(cnjAge)]:null;
          pC=(rw&&rw[f])?r2(rw[f]*coef):undefined;
        }
        let pK=null,kidNote="";
        if(kids>0){const kn=Math.min(2,kids),bk=r2(g["19"][f]*coef);pK=r2(bk*kn);kidNote=kn+" × "+eur(bk)+(kids>2?" (3ᵉ+ gratuit)":"")+" — tarif 19 ans";}
        const tot=r2((pA+((pC&&pC!==undefined)?pC:0)+(pK||0))*fam);
        rows.push({key,fi:f,ins:"avenir",resp:true,gamme:F[key].label,formule:F[key].names[f],
          hospO:F[key].hospO[f],hospN:F[key].hospN[f],honoO:F[key].honoO[f],honoN:F[key].honoN[f],
          dent:F[key].dent[f],opt:F[key].opt[f],ch:F[key].ch[f],md:F[key].md[f],
          chips:[["resp","Responsable"]].concat(fam<1?[["info","Réduction famille −"+Math.round((1-fam)*100)+" %"]]:[]),
          pA,pC:hasCnj?pC:null,pK,kidNote,total:tot,incomplete:false});
      }
    }
  }
  // MUTUELLE VERTE GCI — âge réel, ZT1-4 (régime général) ou grille Alsace-Moselle, 2 enfants payants
  if(on("MV")){
    const g=D.MV;
    const mz=isRL?"AL":(dept?(D.MVZ[dept]!==undefined?String(D.MVZ[dept]):null):null);
    const mvAge=a2=>String(Math.min(Math.max(a2,18),85));
    if(dept&&dept.length===3) warns.push("M. VERTE : grille DOM non fournie (gamme courtage).");
    else if(mz===null) warns.push("M. VERTE : zone inconnue pour ce département — non calculée.");
    else if(age<18) warns.push("M. VERTE : adhésion à partir de 18 ans.");
    else {
      const gr=g[mz];
      if(kids>2) warns.push("M. VERTE : 2 enfants payants appliqués — la gratuité du 3ᵉ enfant et suivants est à confirmer auprès de la mutuelle.");
      for(let f=0;f<5;f++){
        const pA=gr[mvAge(age)][f];
        let pC=null;
        if(hasCnj&&cnjAge!=null) pC=(cnjAge>=18)?gr[mvAge(cnjAge)][f]:undefined;
        let pK=null,kidNote="";
        if(kids>0){const kn=Math.min(2,kids);pK=Math.round(gr["E"][f]*kn*100)/100;kidNote=kn+" enfants payants × "+eur(gr["E"][f])+(kids>2?" — gratuité du 3ᵉ à confirmer":"");}
        const total=Math.round((pA+((pC&&pC!==undefined)?pC:0)+(pK||0))*100)/100;
        const rsp=f<4;
        rows.push({key:"MV",fi:f,ins:"mverte",resp:rsp,gamme:"M. VERTE",formule:F.MV.names[f],
          hospO:F.MV.hospO[f],hospN:F.MV.hospN[f],honoO:F.MV.honoO[f],honoN:F.MV.honoN[f],
          dent:F.MV.dent[f],opt:F.MV.opt[f],ch:F.MV.ch[f],md:F.MV.md[f],
          chips:[rsp?["resp","Responsable"]:["nr","Non responsable"],["info","Âge réel"],["info","Délais de stage"]],
          pA,pC:hasCnj?pC:null,pK,kidNote,total,incomplete:false});
      }
    }
  }
  // LPS HOSPI — hospitalisation seule, zone AVENIR ou colonne RL, 16-100 ans, pas de tarif enfant
  if(on("LPSH")){
    const g=D.LPSH;
    const c=isRL?3:(dept&&D.AVZ[dept]?D.AVZ[dept]-1:null);
    if(c===null){ warns.push("LPS HOSPI : code postal requis pour le zonage AVENIR."); }
    else if(age>=16&&age<=100){
      const a=String(age);
      let pC=null;
      if(hasCnj&&cnjAge!=null&&cnjAge>=16)pC=g[String(Math.min(Math.max(cnjAge,16),100))][c*2+1];
      push("LPSH",0,"",[["nr","Non responsable"],["info","Hospitalisation seule"],["info","IJ 20 €/jour"]],
        g[a][c*2],hasCnj?pC:null,null,kids>0?"mineurs : nous consulter":"",false);
    }
  }
  // TALIS — surcomplémentaire nationale
  if(on("TALIS")&&age>=16){
    const g=D.TALIS;
    const a=String(Math.min(Math.max(age,16),100));
    for(let f=0;f<2;f++){
      const pA=g[a][f*2];
      let pC=null;
      if(hasCnj&&cnjAge!=null&&cnjAge>=16)pC=g[String(Math.min(Math.max(cnjAge,16),100))][f*2+1];
      const kp=g["15"][f*2];
      const pK=kids>0?kp*kids:null;
      push("TALIS",f,"",[["info","Surcomplémentaire"],["nr","Non responsable"]],pA,hasCnj?pC:null,pK,
        kids>0?(kids+" × "+eur(kp)):"",false);
    }
  }
  if(isRL) warns.push("Régime local Alsace-Moselle : grilles MCCI non applicables (taux spécifiques, consulter MCCI) — restent CAP EVOLUTION RL, CAP NR RL et TALIS.");
  if(kids>0&&on("LPSH")) warns.push("LPS HOSPI : pas de tarif enfant dans la grille 2026 — total affiché hors mineurs pour cette gamme.");
  if(kids>0&&on("MCCINOVA")&&!isRL) warns.push("MCCINOVA : les mineurs sont tarifés au tarif 18 ans, sans gratuité à partir du 3ᵉ enfant.");
  rows.sort((x,y)=>x.total-y.total);
  render(rows,warns);
}

async function crmDepot(payload){

    body:JSON.stringify(Object.assign({token:window.CRMLINK.token},payload))});

}

function crmBack(){
  // 1) La fenêtre du CRM est encore ouverte derrière : on la remet devant et on ferme celle-ci.
  //    C'est le seul retour qui ramène exactement sur la conversation quittée.
  try{ if(window.opener&&!window.opener.closed){ window.opener.focus(); window.close(); return; } }catch(e){}
  // 2) Sinon, adresse de retour fournie par le lien (&back=… : la conversation elle-même)
  const bk=window.CRMLINK&&window.CRMLINK.back;
  if(bk){ try{ location.href=bk; return; }catch(e){} }
  // 3) Sinon on ferme simplement : l'onglet du CRM reste celui du dessous
  try{ window.close(); }catch(e){}
  setTimeout(()=>{ if(!document.hidden) alert("Le document est déposé dans la conversation. Fermez cet onglet pour revenir au CRM."); },700);
}

function applyImport(raw){
  const P=new URLSearchParams(raw);
  const imported=[];
  const set=(id,v)=>{if(v!==null&&v!=="")document.getElementById(id).value=v;};
  const naiss=P.get("naiss")||P.get("age"); if(naiss){set("naiss",naiss);imported.push(["Année de naissance / âge",naiss]);}
  const cnj=P.get("cnj")||P.get("conjoint"); if(cnj){set("cnj",cnj);imported.push(["Conjoint (naissance)",cnj]);}
  const dept=P.get("dept")||P.get("cp"); if(dept){set("cp",dept);imported.push(["Département",dept.slice(0,2)]);}
  const kids=P.get("kids")||P.get("mineurs"); if(kids!==null&&kids!==""){set("kids",kids);imported.push(["Mineurs",kids]);}
  const rg=(P.get("regime")||"").toUpperCase();
  const RMAP={SAL:"SAL",SALARIE:"SAL",SALARIES:"SAL",TNS:"TNS",PL:"TNS",ALSACE:"RL",RL:"RL",TNSRL:"TNSRL"};
  const RLBL={SAL:"Salarié",TNS:"TNS",RL:"Salarié RL",TNSRL:"TNS RL"};
  if(RMAP[rg]){set("regime",RMAP[rg]);imported.push(["Régime",RLBL[RMAP[rg]]]);}
  for(const [k,l] of [["adresse","Adresse"],["ville","Ville"],["email","Email"],["tel","Téléphone"]])if(typeof PRO!=="undefined"&&PRO[k])imported.push([l,PRO[k]]);
  let nomTxt="";
  const nom=P.get("nom");
  if(nom)nomTxt=decodeURIComponent(nom).replace(/\+/g," ");
  // Ligne récapitulative permanente en haut : toutes les infos importées
  if(imported.length||nomTxt){
    const PR=typeof PRO!=="undefined"?PRO:{};
    const bits=[];
    if(nomTxt)bits.push((PR.civ?PR.civ+" ":"")+nomTxt);
    if(PR.ddn)bits.push("né(e) "+PR.ddn); else if(naiss)bits.push("né(e) en "+naiss);
    const loc=[PR.cp5||dept,PR.ville].filter(Boolean).join(" ");
    if(loc)bits.push(loc);
    if(RMAP[rg])bits.push(RLBL[RMAP[rg]]);
    if(kids&&+kids>0)bits.push(kids+" mineur"+(+kids>1?"s":""));
    if(PR.email)bits.push(PR.email);
    if(PR.tel)bits.push(PR.tel);
    const b2=document.getElementById("prospect");
    b2.hidden=false;
    b2.textContent="Prospect : "+bits.join("  ·  ");
  }
  if(imported.length||nomTxt){
    // Popup récapitulative : les infos importées doivent être impossibles à rater (jamais en double)
    const prev=document.getElementById("impov"); if(prev)prev.remove();
    const ov=document.createElement("div");
    ov.id="impov";
    ov.style.cssText="position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px";
    ov.innerHTML='<div style="background:var(--card,#fff);color:var(--ink,#12233d);border-radius:14px;max-width:400px;width:100%;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.35);font-family:\'Archivo\',sans-serif">'
      +'<div style="font:800 17px \'Archivo\',sans-serif;margin-bottom:4px">📥 Données importées du CRM</div>'
      +(nomTxt?'<div style="font:700 16px \'Archivo\',sans-serif;color:var(--accent,#1d4ed8);margin-bottom:8px">'+nomTxt.replace(/</g,"&lt;")+'</div>':"")
      +imported.map(([l,v])=>'<div style="display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:14px"><span style="color:var(--muted,#5b6b82)">'+l+'</span><span style="font-weight:800;white-space:nowrap">'+String(v).replace(/</g,"&lt;")+'</span></div>').join("")
      +'<button id="impok" style="margin-top:14px;width:100%;padding:10px;border:0;border-radius:9px;background:var(--accent,#1d4ed8);color:#fff;font:800 15px \'Archivo\',sans-serif;cursor:pointer">OK — voir les tarifs</button></div>';
    document.body.appendChild(ov);
    ov.querySelector("#impok").addEventListener("click",()=>ov.remove());
    ov.addEventListener("click",e=>{if(e.target===ov)ov.remove();});
    calc();
    return true;
  }
  return false;

var PRO=PRO||{}; // coordonnées importées (adhésion) : civ, nom, prenom, ddn, cp5, adresse, ville, email, tel — déjà rempli si le lien portait la fiche
function parseFiche(t){
  for(const k in PRO)delete PRO[k];
  const out=new URLSearchParams();
  // Dates ISO (1983-05-15, format base CRM) → 15/05/1983
  const T=t.replace(/ /g," ").replace(/\b((?:19|20)\d{2})-(\d{2})-(\d{2})\b/g,"$3/$2/$1");
  const dates=[...T.matchAll(/\b\d{1,2}[\/\-.]\d{1,2}[\/\-.](19\d{2}|20[01]\d)\b/g)].map(m=>m[1]);
  const years=[...T.matchAll(/\b(19\d{2}|20[01]\d)\b/g)].map(m=>m[1]);
  const ys=dates.length?dates:years;
  if(ys[0])out.set("naiss",ys[0]);
  if(ys[1])out.set("cnj",ys[1]);
  if(!ys.length){const ag=T.match(/\b(\d{2})\s*ans\b/i);if(ag)out.set("naiss",ag[1]);}
  const dfull=T.match(/\b(\d{1,2}[\/\-.]\d{1,2}[\/\-.](?:19\d{2}|20[01]\d))\b/);
  if(dfull)PRO.ddn=dfull[1].replace(/[\-.]/g,"/");
  const cp=T.match(/\b(\d{5})\b/);
  if(cp){out.set("dept",cp[1].slice(0,2));PRO.cp5=cp[1];}
  else{const d2=T.match(/\bd[ée]pt?\.?\s*:?\s*(\d{2,3})\b/i);if(d2)out.set("dept",d2[1].slice(0,2));}
  // Coordonnées pour le formulaire d'adhésion (lignes étiquetées ou texte libre)
  const em=T.match(/[\w.+\-]+@[\w\-]+\.[A-Za-z]{2,}/); if(em)PRO.email=em[0];
  // Téléphone : accepte 06…, +33 6…, 33 6… (avec ou sans séparateurs), normalisé en 0X XX XX XX XX
  const ph2=T.replace(em?em[0]:"","").match(/\b(?:\+?33[\s.\-]?[1-9]|0[1-9])(?:[\s.\-]?\d{2}){4}\b/);
  if(ph2){
    let tt=ph2[0].replace(/\D/g,"");
    if(tt.length===11&&tt.slice(0,2)==="33")tt="0"+tt.slice(2);
    PRO.tel=tt.length===10?tt.replace(/(\d{2})(?=\d)/g,"$1 ").trim():ph2[0].trim();
  }
  const adl=T.match(/^[\s]*adresse\s*:?\s*(.+)$/im);
  if(adl)PRO.adresse=adl[1].trim();
  else{const ad2=T.split(/\n+/).find(l=>/\d/.test(l)&&/\b(rue|avenue|av\.|boulevard|bd|chemin|place|impasse|all[ée]e|route|lotissement|r[ée]sidence)\b/i.test(l));if(ad2)PRO.adresse=ad2.trim();}
  const vil=T.match(/^[\s]*ville\s*:?\s*(.+)$/im);
  if(vil)PRO.ville=vil[1].trim();
  // Nettoyage adresse : un simple code postal n'est pas une adresse ; « rue 94500 VILLE » se découpe
  if(PRO.adresse){
    if(/^\d{4,5}$/.test(PRO.adresse.trim()))delete PRO.adresse;
    else{const m2=PRO.adresse.match(/^(.*?)[,\s]+(\d{5})\s+(.{2,})$/);if(m2){PRO.adresse=m2[1].trim();if(!PRO.ville)PRO.ville=m2[3].trim();}}
  }
  if(!PRO.ville&&cp){const v2=T.match(new RegExp("\\b"+cp[1]+"\\b[ \\t,\\-–]*([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ' \\-]{1,40})"));if(v2&&!/^(ville|cp\b|email|e-mail|t[ée]l)/i.test(v2[1]))PRO.ville=v2[1].trim();}
  if(/\b(mme|madame)\b/i.test(T))PRO.civ="Mme";
  else if(/\b(m\.|mr|monsieur)\b/i.test(T))PRO.civ="M.";
  const L=T.toLowerCase();
  const rl=/\balsace\b|\bmoselle\b|r[ée]gime local|\brl\b/.test(L);
  let rg="";
  if(/\btns\b|ind[ée]pendant|profession lib|travailleur non|auto.?entrepreneur|artisan|commer[çc]ant|g[ée]rant/.test(L)) rg=rl?"TNSRL":"TNS";
  else if(/salari|\bsal\b|cadre\b|employ[ée]|retrait[ée]/.test(L)) rg=rl?"RL":"SAL";
  else if(rl) rg="RL";
  if(rg)out.set("regime",rg);
  const kid=L.match(/(\d)\s*(enfants?|mineurs?)\b/);
  if(kid)out.set("kids",kid[1]);
  for(const l of T.split(/\n+/).map(s=>s.trim()).filter(Boolean)){
    if(/\d/.test(l))continue;
    let w=l.replace(/[^\p{L}\s'\-.]/gu,"").replace(/\s+/g," ").trim();
    w=w.replace(/^(m\.?|mr|mme|monsieur|madame)\s+/i,"");
    const wl=w.replace(/[^\p{L}\s'\-]/gu,"");
    if(wl.length>=3&&wl.split(" ").length<=5&&!/^(tns|sal|salari|r[ée]gime|conjoint|assur|mutuelle|t[ée]l|mail|email|adresse|ville|civilit|prospect|fiche|note|n[ée]e?\b)/i.test(wl)){
      out.set("nom",encodeURIComponent(wl));
      // Sépare NOM (tout en majuscules) et Prénom pour le formulaire d'adhésion
      const toks=wl.split(" ");
      const noms=toks.filter(x=>x.length>1&&x===x.toLocaleUpperCase("fr"));
      const pres=toks.filter(x=>!(x.length>1&&x===x.toLocaleUpperCase("fr")));
      PRO.nom=(noms.length?noms:toks.slice(0,1)).join(" ");
      PRO.prenom=(noms.length?pres:toks.slice(1)).join(" ");
      break;
    }
  }
  // Garde-fou : un nom seul, sans aucune autre donnée (date, CP, tél, email), n'est pas une fiche
  if(!ys.length&&!cp&&!PRO.tel&&!PRO.email){for(const k in PRO)delete PRO[k];return "";}
  return out.toString();
}

// Import direct : lit le presse-papier et remplit sans afficher la zone de collage
async function importDirect(){
  try{
    if(navigator.clipboard&&navigator.clipboard.readText){
      // 1,5 s max : si le navigateur ne répond pas (permission bloquée), on bascule
      const t=await Promise.race([
        navigator.clipboard.readText(),
        new Promise(r=>setTimeout(()=>r(null),1500))
      ]);
      if(t&&t.trim()){
        const parsed=parseFiche(t);
        if(parsed){applyImport(parsed);return;}
      }
    }
  }catch(e){}
  pasteCapture(); // secours discret : fine barre de collage
}
function pasteCapture(){
  const old=document.getElementById("pastebar"); if(old)old.remove();

  document.body.appendChild(bar);

    else{fired=false;inp.value="";inp.placeholder="Fiche non reconnue — collez une fiche avec date, CP, tél ou email";}};

}

(async()=>{
  const s=await CUSE("sample");

  const DOCK={MCCINOVA:"MCCIDOC",FLEXIA:"FLEXDOC",SOLENCIA:"SOLDOC",CAPEVO:"CAPEVODOC",CAPNR:"CAPNRDOC",REV:"REVDOC",RF50:"REVDOC",RF100:"REVDOC",MV:"MVDOC",TALIS:"TALISDOC"};
  function summary(){
    let out="";
    for(const k of Object.keys(F)){
      const f=F[k],e=EX[k]||{};
      out+="## "+f.label+" ("+COMP[k]+", "+(f.resp?"responsable":"non responsable")+")\nFormules: "+f.names.join(", ")+"\n";
      out+="Hospi Optam: "+f.hospO.join("/")+" | hors Optam: "+f.hospN.join("/")+" | Chambre: "+f.ch.join("/")+"\n";
      out+="Consult Optam: "+f.honoO.join("/")+" | hors: "+f.honoN.join("/")+"\n";
      out+="Prothèses dentaires: "+f.dent.join("/")+" | Implant: "+(e.imp||[]).join("/")+" | Ortho R: "+(e.orthR||[]).join("/")+" | Ortho NR: "+(e.orthN||[]).join("/")+"\n";
      out+="Optique: "+f.opt.join("/")+" | Lentilles acc: "+(e.lentA||[]).join("/")+" | réf: "+(e.lentR||[]).join("/")+" | Audio: "+(e.aud||[]).join("/")+" | Méd douce: "+f.md.join("/")+"\n";
      out+="Notes: "+(TGNOTE[k]||"")+"\n\n";
    }
    return out;
  }
  function docsFor(question){
    const ql=question.toLowerCase();
    const picked=new Set();
    for(const[k,words]of Object.entries(GKEYS)) if(words.some(w=>ql.includes(w))) picked.add(DOCK[k]);
    let out="";
    for(const d of picked) out+="\n\n===== DOCUMENT "+d+" =====\n"+(D.DOCSMD[d]||"");
    return out;
  }

      log.textContent=log.textContent.slice(0,anchor)+r.text;
      hist.push({role:"user",content:question},{role:"assistant",content:r.text});
      if(hist.length>8)hist.splice(0,hist.length-8);
    }catch(e){
      log.textContent+="[Assistant indisponible: "+(e&&e.code||e)+"]";
    }
    send.disabled=false; log.scrollTop=log.scrollHeight;
  }
  send.addEventListener("click",ask);
  q.addEventListener("keydown",e=>{if(e.key==="Enter")ask();});
})();
